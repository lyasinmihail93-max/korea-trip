<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
--primary: #2a9d8f; --accent: #e9c46a; --bg: #fafbfb; --text: #264653;
--light-text: #6a7b7d; --visited-bg: #a5d6a7; --visited-light: #c8e6c9;
--border: #e0e6e6; --button-bg-google: #e3f2fd; --button-bg-naver: #f9fbe7;
--button-bg-done: #e0f2f1; --progress-light: #e8f5e9;
--route-btn-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
--event-flight: #1565c0; --event-hotel: #2e7d32; --event-car: #ef6c00; --event-city: #616161;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: 'Noto Sans', 'Noto Sans KR', sans-serif;
background-color: #fafbfb;
background-image: radial-gradient(#e0f2f1 1.5px, transparent 1.5px);
background-size: 20px 20px;
color: var(--text);
padding: 12px;
line-height: 1.6;
scroll-behavior: smooth;
padding-bottom: 60px;
}
.lang-selector { position: fixed; top: 16px; right: 16px; z-index: 1000; }
.lang-select {
padding: 8px 12px; border: 2px solid var(--primary); border-radius: 8px;
background: white; color: var(--text); font-family: inherit;
font-size: 0.9em; font-weight: 600; cursor: pointer; min-width: 100px;
}
header {
text-align: center; margin-bottom: 16px; padding: 60px 12px;
border-bottom: 1px solid var(--border);
background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('header-bg.jpg');
background-size: cover; background-position: center; color: white;
text-shadow: 0 2px 4px rgba(0,0,0,0.7); border-radius: 12px;
}
h1 { font-size: 1.4em; margin-bottom: 4px; color: white; font-weight: 700; }
.subtitle { font-size: 0.95em; color: rgba(255,255,255,0.9); }
.progress-bar {
background: rgba(255,255,255,0.95); padding: 12px; border-radius: 8px;
margin-bottom: 16px; font-size: 0.9em; color: var(--light-text);
border: 1px solid var(--primary); position: relative; overflow: hidden;
}
.progress-bar::before {
content: ''; position: absolute; top: 0; left: 0; height: 100%;
background: linear-gradient(90deg, var(--visited-light) 0%, #81c784 50%, var(--visited-light) 100%);
width: var(--progress-width, 0%); transition: width 0.5s ease; z-index: 0;
}
.progress-bar .progress-text { position: relative; z-index: 1; }
.route-btn {
width: 100%; padding: 14px; background: var(--route-btn-bg); color: white;
border: none; border-radius: 12px; font-weight: 700; font-size: 1em;
cursor: pointer; margin-bottom: 8px; transition: all 0.3s ease;
}
.route-btn:hover { transform: translateY(-2px); }
.route-btn.active { background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%); }
.city-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.city-tab {
flex: 1 0 calc(20% - 8px); min-width: 70px; padding: 10px 6px;
background: #f0f5f5; border: 1px solid var(--primary); border-radius: 8px;
font-weight: 600; color: var(--text); cursor: pointer; min-height: 44px;
transition: all 0.3s ease; font-size: 0.8em; text-align: center;
}
.city-tab.active { background: var(--primary); color: white; }
.city-banner {
width: 100%; height: 200px; background-size: cover; background-position: center;
border-radius: 12px; margin-bottom: 16px; position: relative;
display: flex; align-items: center; justify-content: center;
}
.city-banner::before {
content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6)); border-radius: 12px;
}
.city-banner .city-name {
position: relative; z-index: 1; color: white; font-size: 1.5em;
font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
.accommodation {
background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px;
box-shadow: 0 2px 6px rgba(42, 157, 143, 0.1); border-left: 4px solid var(--primary);
}
.accommodation-title { font-weight: 600; margin-bottom: 8px; color: var(--primary); }
.accommodation-list { margin-top: 12px; }
.accommodation-item { padding: 10px 0; border-bottom: 1px dashed var(--border); }
.accommodation-item:last-child { border-bottom: none; }
.accommodation-name { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
.booking-dates { font-size: 0.8em; color: var(--primary); background: var(--progress-light); padding: 2px 8px; border-radius: 4px; font-weight: 600; }
.accommodation-address { font-size: 0.85em; color: var(--light-text); margin-bottom: 6px; }
.accommodation-links { display: flex; gap: 6px; }
.accommodation-links a {
flex: 1; padding: 6px; text-align: center; border-radius: 6px;
text-decoration: none; font-size: 0.8em; font-weight: 600;
}
.link-google { background: var(--button-bg-google); color: #1565c0; border: 1px solid #1565c0; }
.link-naver { background: var(--button-bg-naver); color: #5d4037; border: 1px solid #5d4037; }
.link-booking { background: #fff3e0; color: #ef6c00; border: 1px solid #ef6c00; }
.city-progress {
background: rgba(255,255,255,0.95); padding: 10px 16px; border-radius: 8px;
margin-bottom: 16px; font-size: 0.85em; color: var(--light-text);
border: 1px solid var(--primary); position: relative; overflow: hidden;
}
.city-progress::before {
content: ''; position: absolute; top: 0; left: 0; height: 100%;
background: linear-gradient(90deg, var(--visited-light) 0%, #81c784 50%, var(--visited-light) 100%);
width: var(--progress-width, 0%); transition: width 0.5s ease; z-index: 0;
}
.city-progress .progress-text { position: relative; z-index: 1; font-weight: 600; }
.city-subtabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.subtab {
flex: 1; min-width: 100px; padding: 10px; background: #f0f5f5;
border: 1px solid var(--primary); border-radius: 8px; font-weight: 600;
color: var(--text); cursor: pointer; min-height: 44px; transition: all 0.3s ease;
}
.subtab.active { background: var(--primary); color: white; transform: scale(1.02); }
.items-list {
background: white; border-radius: 12px; overflow: hidden;
box-shadow: 0 2px 6px rgba(42, 157, 143, 0.1); border-left: 4px solid var(--primary);
}
.item { padding: 14px 16px; border-bottom: 1px solid var(--border); position: relative; transition: all 0.3s ease; }
.item:last-child { border-bottom: none; }
.item.visited { background-color: var(--visited-bg) !important; }
.item.visited .item-name, .item.visited .item-desc,
.item.visited .price-info, .item.visited .avg-check {
text-decoration: line-through !important; color: #00695c !important;
}
.item-name { font-weight: 600; margin-bottom: 4px; font-size: 1.05em; padding-left: 20px; }
.item-stars { font-size: 1em; color: #ffb300; padding-left: 20px; margin-top: 2px; letter-spacing: 1px; }
.item-desc { font-size: 0.95em; margin: 8px 0; padding-left: 20px; }
.price-info { font-size: 0.9em; color: #ff8f00; padding-left: 20px; margin-top: 4px; }
.avg-check { font-size: 0.9em; color: var(--primary) !important; font-weight: 600; padding-left: 20px; margin-top: 4px; }
.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; padding-left: 20px; }
button {
flex: 1; min-width: 90px; padding: 10px; border: 1px solid var(--primary);
border-radius: 6px; font-size: 0.85em; font-weight: 600; cursor: pointer;
min-height: 44px; transition: all 0.3s ease;
}
.btn-done { background: var(--button-bg-done); color: var(--primary); }
.btn-done.done { background: var(--button-bg-done); color: var(--primary); border-color: var(--primary); }
.btn-google { background: var(--button-bg-google); color: #1565c0; }
.btn-naver { background: var(--button-bg-naver); color: #5d4037; }
.calendar-container {
background: white; border-radius: 12px; padding: 16px;
margin-bottom: 16px; box-shadow: 0 2px 6px rgba(42,157,143,0.1);
}
.calendar-table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
.calendar-table th {
background: var(--primary); color: white; padding: 10px;
text-align: left; font-weight: 600; position: sticky; top: 0;
}
.calendar-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.calendar-table tr:last-child td { border-bottom: none; }
.event-item { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 6px; padding: 4px 0; }
.event-item:last-child { margin-bottom: 0; }
.event-icon { font-size: 1.1em; min-width: 20px; text-align: center; }
.event-flight .event-icon { color: var(--event-flight); }
.event-hotel .event-icon { color: var(--event-hotel); }
.event-car .event-icon { color: var(--event-car); }
.event-city .event-icon { color: var(--event-city); }
.event-time { font-weight: 600; font-size: 0.9em; color: var(--light-text); min-width: 70px; }
.event-desc { color: var(--text); }
.route-container { border-radius: 12px; overflow: hidden; margin: 16px 0; }
.route-map { width: 100%; display: block; }
#backToTop {
position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white;
width: 44px; height: 44px; border-radius: 50%; border: 2px solid white;
font-size: 18px; cursor: pointer; display: none; z-index: 99;
}
.reset-container { text-align: center; margin-top: 40px; margin-bottom: 20px; padding-top: 20px; border-top: 1px dashed #ccc; }
.reset-btn {
background-color: #e74c3c; color: white; border: none;
padding: 12px 24px; border-radius: 8px; font-size: 0.9em;
cursor: pointer; opacity: 0.6; transition: opacity 0.3s;
}
.reset-btn:hover { opacity: 1; background-color: #c0392b; }
.document-link {
display: flex; align-items: center; gap: 12px; padding: 16px;
background: var(--button-bg-google); border: 2px solid var(--primary);
border-radius: 8px; text-decoration: none; color: var(--text);
transition: all 0.3s ease;
}
.document-link:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(42, 157, 143, 0.2); }
.documents-container {
background: white; border-radius: 12px; padding: 20px;
margin-bottom: 16px; box-shadow: 0 2px 6px rgba(42, 157, 143, 0.1);
}
.documents-container h2 { color: var(--primary); margin-bottom: 20px; font-size: 1.3em; }
.documents-container h3 { color: var(--text); margin-bottom: 12px; font-size: 1.1em; }
.documents-grid { display: grid; gap: 12px; margin-bottom: 24px; }
.documents-info {
margin-top: 24px; padding: 16px; background: var(--progress-light);
border-radius: 8px; border-left: 4px solid var(--primary);
}
.documents-info-title { font-weight: 600; color: var(--primary); margin-bottom: 8px; }
.documents-info-text { font-size: 0.9em; color: var(--light-text); line-height: 1.6; }
.cities-intro {
background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px;
text-align: center; color: var(--light-text);
}
@media (min-width: 768px) { body { max-width: 800px; margin: 0 auto; } .city-tab { min-width: 80px; padding: 10px 8px; } }
@media (max-width: 480px) {
.city-tab { flex: 1 0 calc(25% - 8px); min-width: 60px; padding: 8px 4px; font-size: 0.7em; }
header { padding: 50px 12px; } h1 { font-size: 1.2em; }
.city-banner { height: 160px; } .city-banner .city-name { font-size: 1.3em; }
.lang-selector { top: 12px; right: 12px; }
.lang-select { min-width: 80px; padding: 6px 10px; font-size: 0.85em; }
}
</style>
</head>

let currentLang = 'ru';
let ui = DB.ru.ui;
let content = DB.ru;

function t(key, params = {}) {
let text = ui[key] || key;
Object.keys(params).forEach(param => {
text = text.replace(new RegExp(`\\{${param}\\}`, 'g'), params[param]);
});
return text;
}

function setLanguage(lang) {
currentLang = lang;
ui = DB[lang].ui;
content = DB[lang];

document.querySelectorAll('[data-i18n]').forEach(el => {
el.textContent = t(el.getAttribute('data-i18n'));
});

updateCityTabs();
if (currentView === 'calendar') document.getElementById('content').innerHTML = renderCalendar();
else if (currentView === 'documents') document.getElementById('content').innerHTML = renderDocuments();
else if (currentView === 'cities' && currentCity) {
document.getElementById('content').innerHTML = renderCityContent(currentCity, currentSubtab);
attachEventListeners();
}
updateProgress();
}

function updateCityTabs() {
const cities = {
jeju: t('city_jeju'), seoul: t('city_seoul'), jeonju: t('city_jeonju'),
jindo: t('city_jindo'), busan: t('city_busan'), gyeongju: t('city_gyeongju'),
andong: t('city_andong'), samcheok: t('city_samcheok'), sokcho: t('city_sokcho')
};
document.querySelectorAll('.city-tab').forEach(tab => {
tab.textContent = cities[tab.dataset.city] || tab.dataset.city;
});
}

function generateStars(rating) {
const full = Math.floor(rating);
const hasHalf = rating % 1 >= 0.5;
return '⭐'.repeat(full) + (hasHalf ? '✨' : '') + '☆'.repeat(5 - full - (hasHalf ? 1 : 0));
}

jeju: [{ name: "Seogwipo-si", address: "271 Taesinhaean-ro, Seogwipo-si", google: "https://maps.app.goo.gl/F4addr6TrUVHqcd77", naver: "https://naver.me/5OQ7cmRT", booking: "bookings/jeju-seogwipo.pdf", dates: "29–31.07" }],

andong: [{ name: "Haru The Guesthouse", address: "737-7, Gyeongdong-ro, Andong", google: "https://maps.app.goo.gl/A3Zrmp6AsuX5wmoz8", naver: "https://map.naver.com/p/entry/place/1785290845", booking: "bookings/andong-haru.pdf", dates: "09.08" }],
sokcho: [{ name: "Sokcho Summitbay", address: "17F, 11, Yeongnanghaean 8-gil, Sokcho", google: "https://maps.app.goo.gl/QuyZEDtgoxg2NfbD6", naver: "https://naver.me/GhwvpTAx", booking: "bookings/sokcho-summitbay.pdf", dates: "10–12.08" }]

const spas = {
seoul: [{ name: "Samho Gungjeon Sauna", google: "https://maps.app.goo.gl/YAKin24Y17vFW1Hj7", naver: "https://naver.me/F058GGLT", desc: currentLang === 'ru' ? "Самый красивый чимчильбан" : currentLang === 'en' ? "Most beautiful jimjilbang" : currentLang === 'de' ? "Schönstes Jjimjilbang" : "가장 아름다운 찜질방", price: "22 000 ₩", stars: 4.8 }],
busan: [{ name: "SPA LAND Centum City", google: "https://maps.app.goo.gl/C7P95n3UicmfgpP99", naver: "https://naver.me/5CClLKb5", desc: currentLang === 'ru' ? "Одна из крупнейших бань в мире" : currentLang === 'en' ? "One of the largest spas in the world" : currentLang === 'de' ? "Eines der größten Bäder der Welt" : "세계 최대 찜질방 중 하나", price: "25 000 ₩", stars: 4.9 }],
sokcho: [{ name: "Seorak Spa Valley", google: "https://maps.app.goo.gl/JEdUzJLQMwbMng4ZA", naver: "https://naver.me/5p0Gl2yw", desc: currentLang === 'ru' ? "Горячие источники" : currentLang === 'en' ? "Hot springs" : currentLang === 'de' ? "Heiße Quellen" : "온천", price: "12 000 ₩", stars: 4.6 }]
};

let visitedPlaces = JSON.parse(localStorage.getItem('visitedPlaces_korea2026')) || {};
let visitedEats = JSON.parse(localStorage.getItem('visitedEats_korea2026')) || {};
let visitedSpas = JSON.parse(localStorage.getItem('visitedSpas_korea2026')) || {};
let currentCity = null;
let currentSubtab = 'places';
let currentView = 'calendar';

return `<div class="calendar-container">
<table class="calendar-table">
<thead><tr><th>${t('calendar_date')}</th><th style="width:100%">${t('calendar_events')}</th></tr></thead>
<tbody>${cal.map(day => `
<tr><td><strong>${day.date}</strong></td><td>${day.events.map(ev => `
<div class="event-item event-${ev.type}">
<span class="event-icon">${ev.type === 'flight' ? '✈️' : ev.type === 'hotel' ? '🏨' : ev.type === 'car' ? '🚗' : '🏙️'}</span>
<span class="event-time">${ev.time}</span><span class="event-desc">${ev.desc}</span>
</div>`).join('')}</td></tr>`).join('')}
</tbody></table></div>`;
}

return `<div class="documents-container">
<h2 data-i18n="docs_title">${t('docs_title')}</h2>
<div style="margin-bottom:24px"><h3 data-i18n="docs_flights">${t('docs_flights')}</h3>
<div class="documents-grid">${content.flights.map(ticket => `

<div style="margin-bottom:24px"><h3 data-i18n="docs_entry">${t('docs_entry')}</h3>
<div class="documents-grid">
<a href="documents/entry_permit_Kolesnikova.pdf" target="_blank" class="document-link">
<span style="font-size:1.5em">👤</span><div style="flex:1">
<div style="font-weight:600;margin-bottom:4px">Kolesnikova</div>
<div style="font-size:0.85em;color:var(--light-text)" data-i18n="docs_entry_desc">${t('docs_entry_desc')}</div>
</div><span style="color:var(--primary);font-weight:600">📥 PDF</span></a>
<a href="documents/entry_permit_Liasin.pdf" target="_blank" class="document-link">
<span style="font-size:1.5em">👤</span><div style="flex:1">
<div style="font-weight:600;margin-bottom:4px">Liasin</div>
<div style="font-size:0.85em;color:var(--light-text)" data-i18n="docs_entry_desc">${t('docs_entry_desc')}</div>
</div><span style="color:var(--primary);font-weight:600">📥 PDF</span></a>
</div></div>
<div><h3 data-i18n="docs_insurance">${t('docs_insurance')}</h3>
<a href="documents/polis.pdf" target="_blank" class="document-link">
<span style="font-size:1.5em">🏥</span><div style="flex:1">
<div style="font-weight:600;margin-bottom:4px">${t('docs_insurance')}</div>
<div style="font-size:0.85em;color:var(--light-text)" data-i18n="docs_insurance_desc">${t('docs_insurance_desc')}</div>
</div><span style="color:var(--primary);font-weight:600">📥 PDF</span></a></div>
<div class="documents-info"><div class="documents-info-title" data-i18n="docs_important_title">${t('docs_important_title')}</div>
<div class="documents-info-text" data-i18n="docs_important_text">${t('docs_important_text')}</div></div>
</div>`;
}

function renderMap() {
return `<div class="route-container"><img src="route-map.jpg" alt="Route Map" class="route-map"></div>`;
}

function renderCitiesIntro() {
return `<div class="cities-intro">
<h2 style="color:var(--primary);margin-bottom:12px" data-i18n="cities_intro_title">${t('cities_intro_title')}</h2>
<p data-i18n="cities_intro_text">${t('cities_intro_text')}</p></div>`;
}

function getCityDisplayName(key) {
const map = {jeju: t('city_jeju'), seoul: t('city_seoul'), jeonju: t('city_jeonju'), jindo: t('city_jindo'), busan: t('city_busan'), gyeongju: t('city_gyeongju'), andong: t('city_andong'), samcheok: t('city_samcheok'), sokcho: t('city_sokcho')};
return map[key] || key;
}

function getSpaKey(cityKey) {
if(cityKey==='sokcho') return 'sokcho';
if(cityKey==='busan') return 'busan';
if(cityKey==='seoul') return 'seoul';
return null;
}

function renderAccommodation(cityKey) {
const list = accommodations[cityKey];
if(!list || list.length===0) return '';
let html = `<div class="accommodation"><div class="accommodation-title" data-i18n="accommodation_title">${t('accommodation_title')}</div>`;
if(list.length===1) {
const a = list[0];
html += `<div class="accommodation-name">${a.name}<span class="booking-dates">${a.dates}</span></div>
<div class="accommodation-address">${a.address}</div>
<div class="accommodation-links">
<a href="${a.google}" target="_blank" class="link-google" data-i18n="google_maps">${t('google_maps')}</a>
<a href="${a.naver}" target="_blank" class="link-naver" data-i18n="naver_maps">${t('naver_maps')}</a>
${a.booking?`<a href="${a.booking}" target="_blank" class="link-booking" data-i18n="booking_link">${t('booking_link')}</a>`:''}
</div>`;
} else {
html += '<div class="accommodation-list">';
list.forEach(a => {
html += `<div class="accommodation-item">
<div class="accommodation-name">${a.name}<span class="booking-dates">${a.dates}</span></div>
<div class="accommodation-address">${a.address}</div>
<div class="accommodation-links">
<a href="${a.google}" target="_blank" class="link-google" data-i18n="google_maps">${t('google_maps')}</a>
<a href="${a.naver}" target="_blank" class="link-naver" data-i18n="naver_maps">${t('naver_maps')}</a>
${a.booking?`<a href="${a.booking}" target="_blank" class="link-booking" data-i18n="booking_link">${t('booking_link')}</a>`:''}
</div></div>`;
});
html += '</div>';
}
html += '</div>';
return html;
}

function renderCityProgress(cityKey) {
const cityName = getCityDisplayName(cityKey);
let total=0, visited=0;
const places = content.places[cityName] || [];
total += places.length;
visited += places.filter(i => visitedPlaces[`place-${cityName}-${i.name}`]).length;
const eats = content.eats[cityName] || [];
total += eats.length;
visited += eats.filter(i => visitedEats[`eat-${cityName}-${i.name}`]).length;
const sKey = getSpaKey(cityKey);
if(sKey && spas[sKey]) { total += spas[sKey].length; visited += spas[sKey].filter(i => visitedSpas[`spa-${cityName}-${i.name}`]).length; }
const percent = total>0 ? Math.round((visited/total)*100) : 0;
return `<div class="city-progress" style="--progress-width:${percent}%"><span class="progress-text">${t('progress_visited',{visited,total,percent})}</span></div>`;
}

function renderSubtabs(cityKey, hasSpa) {
return `<div class="city-subtabs">
<button class="subtab ${currentSubtab==='places'?'active':''}" data-type="places" data-city="${cityKey}" data-i18n="subtab_places">${t('subtab_places')}</button>
<button class="subtab ${currentSubtab==='eats'?'active':''}" data-type="eats" data-city="${cityKey}" data-i18n="subtab_eats">${t('subtab_eats')}</button>
${hasSpa?`<button class="subtab ${currentSubtab==='spas'?'active':''}" data-type="spas" data-city="${cityKey}" data-i18n="subtab_spas">${t('subtab_spas')}</button>`:''}
</div>`;
}

function renderItemsList(items, type, cityKey, cityName) {
if(!items || items.length===0) return `<div class="items-list"><p style="padding:16px;color:var(--light-text)" data-i18n="not_added">${t('not_added')}</p></div>`;
return `<div class="items-list">${items.map(item => {
const id = `${type}-${cityName}-${item.name}`;
const isVisited = type==='place'?visitedPlaces[id]:type==='eat'?visitedEats[id]:visitedSpas[id];
const btnText = isVisited?(type==='eat'?t('btn_tried'):t('btn_visited')):t('btn_mark');
return `<div class="item ${isVisited?'visited':''}" data-id="${id}">
<div class="item-name">${item.name}</div><div class="item-stars">${generateStars(item.stars)}</div>
<div class="item-desc">${item.desc}</div>
${item.price?`<div class="price-info">${t('price_label')}${type==='place'?t('entry_fee'):''}${item.price}</div>`:''}
${item.avgCheck?`<div class="avg-check">${t('avg_check')} ${item.avgCheck}</div>`:''}
<div class="actions">
<button class="btn-done ${isVisited?'done':''}" data-id="${id}" data-type="${type}">${btnText}</button>
<button class="btn-google" onclick="window.open('${item.google}','_blank')">gMaps</button>
<button class="btn-naver" onclick="window.open('${item.naver}','_blank')">🚗 Naver</button>
</div></div>`;
}).join('')}</div>`;
}

function renderCityContent(cityKey, subtab) {
const cityName = getCityDisplayName(cityKey);
let html = `<div class="city-banner" style="background-image:url('${cityKey}-banner.jpg')"><div class="city-name">${cityName}</div></div>`;
const acc = renderAccommodation(cityKey); if(acc) html += acc;
html += renderCityProgress(cityKey);
const hasSpa = getSpaKey(cityKey) !== null;
html += renderSubtabs(cityKey, hasSpa);
if(subtab==='places') { const items = content.places[cityName]||[]; html += renderItemsList(items,'place',cityKey,cityName); }
else if(subtab==='eats') { const items = content.eats[cityName]||[]; html += renderItemsList(items,'eat',cityKey,cityName); }
else if(subtab==='spas' && hasSpa) { const items = spas[getSpaKey(cityKey)]||[]; html += renderItemsList(items,'spa',cityKey,cityName); }
return html;
}

function updateProgress() {
let totalP=0, visitedP=0, totalE=0, visitedE=0;
Object.keys(content.places).forEach(city => {
const items = content.places[city];
totalP += items.length;
visitedP += items.filter(i => visitedPlaces[`place-${city}-${i.name}`]).length;
});
Object.keys(content.eats).forEach(city => {
const items = content.eats[city];
totalE += items.length;
visitedE += items.filter(i => visitedEats[`eat-${city}-${i.name}`]).length;
});
const totalS = Object.values(spas).reduce((s,a)=>s+a.length,0);
const visitedS = Object.values(visitedSpas).filter(v=>v).length;
const total = totalP+totalE+totalS;
const visited = visitedP+visitedE+visitedS;
const percent = total>0?Math.round((visited/total)*100):0;
const bar = document.getElementById('progressBar');
bar.style.setProperty('--progress-width',`${percent}%`);
bar.innerHTML = `<span class="progress-text">${t('progress_full',{placesVisited:visitedP,placesTotal:totalP,eatsVisited:visitedE,eatsTotal:totalE,spasVisited:visitedS,spasTotal:totalS,percent})}</span>`;
}

function handleDoneClick(btn) {
const id = btn.dataset.id, type = btn.dataset.type;
if(type==='place') { visitedPlaces[id]=!visitedPlaces[id]; localStorage.setItem('visitedPlaces_korea2026',JSON.stringify(visitedPlaces)); }
else if(type==='eat') { visitedEats[id]=!visitedEats[id]; localStorage.setItem('visitedEats_korea2026',JSON.stringify(visitedEats)); }
else if(type==='spa') { visitedSpas[id]=!visitedSpas[id]; localStorage.setItem('visitedSpas_korea2026',JSON.stringify(visitedSpas)); }
const item = btn.closest('.item');
if(item) {
if(visitedPlaces[id]||visitedEats[id]||visitedSpas[id]) {
item.classList.add('visited');
btn.textContent = type==='eat'?t('btn_tried'):t('btn_visited');
} else {
item.classList.remove('visited');
btn.textContent = t('btn_mark');
}
}
updateProgress();
if(currentCity) {
const cp = document.querySelector('.city-progress');
if(cp) cp.outerHTML = renderCityProgress(currentCity);
}
}

function attachEventListeners() {
document.querySelectorAll('.subtab').forEach(btn => {
btn.addEventListener('click', function() {
document.querySelectorAll('.subtab').forEach(s=>s.classList.remove('active'));
this.classList.add('active');
currentSubtab = this.dataset.type;
const city = this.dataset.city;
const container = document.getElementById('content');
const banner = container.querySelector('.city-banner')?.outerHTML || '';
const acc = accommodations[city]?renderAccommodation(city):'';
const progress = renderCityProgress(city);
const hasSpa = getSpaKey(city)!==null;
const subtabs = renderSubtabs(city,hasSpa);
let content_html = '';
const cityName = getCityDisplayName(city);
if(currentSubtab==='places') { const items=content.places[cityName]||[]; content_html=renderItemsList(items,'place',city,cityName); }
else if(currentSubtab==='eats') { const items=content.eats[cityName]||[]; content_html=renderItemsList(items,'eat',city,cityName); }
else if(currentSubtab==='spas' && hasSpa) { const items=spas[getSpaKey(city)]||[]; content_html=renderItemsList(items,'spa',city,cityName); }
container.innerHTML = banner+acc+progress+subtabs+content_html;
attachEventListeners();
});
});
document.querySelectorAll('.btn-done').forEach(btn => {
btn.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); handleDoneClick(this); });
});
}

document.addEventListener('DOMContentLoaded', function() {
document.getElementById('languageSelect').addEventListener('change', e => setLanguage(e.target.value));
document.getElementById('resetBtn').addEventListener('click', function() {
if(confirm(t('reset_confirm'))) {
localStorage.removeItem('visitedPlaces_korea2026');
localStorage.removeItem('visitedEats_korea2026');

}
});

document.getElementById('cityTabs').style.display='none';

updateProgress();
});

updateProgress();
});
document.getElementById('citiesTab').addEventListener('click', function() {
document.querySelectorAll('.route-btn').forEach(b=>b.classList.remove('active'));
this.classList.add('active');
document.getElementById('cityTabs').style.display='flex';
document.querySelectorAll('.city-tab').forEach(t=>t.classList.remove('active'));
currentCity=null; currentView='cities';
document.getElementById('content').innerHTML=renderCitiesIntro();
updateProgress();
});
document.querySelectorAll('.city-tab').forEach(tab => {
tab.addEventListener('click', function() {
document.querySelectorAll('.route-btn').forEach(b=>b.classList.remove('active'));
document.getElementById('citiesTab').classList.add('active');
document.querySelectorAll('.city-tab').forEach(t=>t.classList.remove('active'));
this.classList.add('active');
currentCity=this.dataset.city; currentSubtab='places';
document.getElementById('content').innerHTML=renderCityContent(currentCity,currentSubtab);
attachEventListeners();
updateProgress();
});
});
document.getElementById('content').innerHTML=renderCalendar();
updateProgress();
updateCityTabs();
window.addEventListener('scroll',() => {
const btn=document.getElementById('backToTop');
btn.style.display=window.scrollY>300?'block':'none';
});
document.getElementById('backToTop').addEventListener('click',e => { e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'}); });
});
</script>
